{% set name = "pyudev" %}
{% set version = "0.24.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pyudev-{{ version }}.tar.gz
  sha256: 4e7faaec419b81a902d057568101819f448972c0cf448bb9c22203e4fc6a8eb9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - six

test:
  imports:
    - pyudev
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://pyudev.readthedocs.org/
  summary: A libudev binding
  doc_url: https://pythonhosted.org/pyudev/
  license: LGPL-2.1-only
  license_file: COPYING

extra:
  recipe-maintainers:
    - hmaarrfk
    - ruben-arts
